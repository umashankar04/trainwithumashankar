<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Technical learning, fitness content, and continuous self-improvement.{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">{{ site.name }}</a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <a class="{{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
      <a class="{{ 'active' if request.endpoint == 'about' else '' }}" href="{{ url_for('about') }}">About Me</a>
      <a class="{{ 'active' if request.endpoint in ['tech', 'resource_detail'] else '' }}" href="{{ url_for('tech') }}">Tech</a>
      <a class="{{ 'active' if request.endpoint == 'fitness' else '' }}" href="{{ url_for('fitness') }}">Fitness Connect</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <p>&copy; {{ site.person_name }}. Built for learning and sharing.</p>
    <div><a href="{{ url_for('home') }}">Home</a> <a href="{{ url_for('tech') }}">Tech</a> <a href="{{ url_for('fitness') }}">Fitness</a></div>
  </footer>
</body>
</html>
